name: Build and regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MediaParser.sln
      - run: dotnet build MediaParser.sln --no-restore --warnaserror
      - run: dotnet run --project tests/algorithm/AlgorithmRegressionTests.csproj
      - run: dotnet run --project tests/media/MediaParser.MediaTests.csproj
      - run: dotnet run --project tests/storage/MediaParser.StorageTests.csproj
      - run: dotnet run --project tests/jobs/MediaParser.JobTests.csproj
      - name: HTTP integration
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project MediaParser/MediaParser.csproj --no-build --no-launch-profile --urls http://localhost:5125 > /tmp/mediaparser.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:5125/Parser/SearchByMedia > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http/smoke.py
